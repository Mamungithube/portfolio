<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
    <!-- Golden Yellow Card Background -->
    <rect width="200" height="200" rx="36" fill="#E89C1E"/>
    
    <!-- Official W3C WebSocket Black Geometric Icon -->
    <g fill="#1A1918" transform="translate(36, 20) scale(0.64)">
        <!-- Top Parallelogram -->
        <path d="M 32 10 L 100 10 L 80 30 L 12 30 Z"/>
        <!-- Upper Left Vertical Hook -->
        <path d="M 32 30 L 52 30 L 52 68 L 32 88 L 32 30 Z"/>
        <!-- Right Arrow Hook -->
        <path d="M 100 24 L 120 44 L 120 90 L 100 90 L 100 56 Z"/>
        <!-- Center Interconnecting Diagonal Stream -->
        <path d="M 52 44 L 100 92 L 80 112 L 32 64 Z"/>
        <!-- Bottom Base Parallelogram -->
        <path d="M 42 106 L 124 106 L 104 126 L 22 126 Z"/>
    </g>

    <!-- "Websocket" Bold White Label -->
    <text x="100" y="170" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Websocket</text>
</svg>
