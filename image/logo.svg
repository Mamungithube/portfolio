<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Animated Gradient for M -->
    <linearGradient id="mGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35">
        <animate attributeName="stop-color" values="#FF6B35;#FFB4A2;#FF6B35" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#FF8C5A" />
      <stop offset="100%" stop-color="#FFB4A2">
        <animate attributeName="stop-color" values="#FFB4A2;#FF6B35;#FFB4A2" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E27"/>
      <stop offset="100%" stop-color="#1A1F3A"/>
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="neonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .logo-frame {
      transition: all 0.4s ease;
    }
    .logo-m-path {
      stroke-dasharray: 450;
      stroke-dashoffset: 0;
      animation: pulseStroke 3s ease-in-out infinite alternate;
    }
    .logo-center-dot {
      animation: dotPulse 2s ease-in-out infinite;
    }
    @keyframes pulseStroke {
      0% {
        stroke-width: 17;
        filter: drop-shadow(0 0 4px rgba(255, 107, 53, 0.4));
      }
      100% {
        stroke-width: 19;
        filter: drop-shadow(0 0 15px rgba(255, 107, 53, 0.9));
      }
    }
    @keyframes dotPulse {
      0%, 100% {
        r: 6;
        opacity: 0.8;
      }
      50% {
        r: 8.5;
        opacity: 1;
      }
    }
  </style>

  <!-- Outer Rounded Shield Frame -->
  <rect class="logo-frame" x="15" y="15" width="170" height="170" rx="42" fill="url(#bgGrad)" stroke="url(#mGradient)" stroke-width="4" stroke-opacity="0.7"/>
  
  <!-- Subtle Tech Details -->
  <path d="M 40 32 L 160 32" stroke="#FF6B35" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="5 5"/>
  <path d="M 40 168 L 160 168" stroke="#FF6B35" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="5 5"/>
  <circle cx="160" cy="40" r="3.5" fill="#FF6B35" fill-opacity="0.6"/>
  <circle cx="40" cy="160" r="3.5" fill="#FF6B35" fill-opacity="0.6"/>

  <!-- Main Geometric Letter M with Glow -->
  <g filter="url(#neonGlow)">
    <path class="logo-m-path" 
          d="M 48 152 
             V 52 
             L 100 115 
             L 152 52 
             V 152" 
          fill="none" 
          stroke="url(#mGradient)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Central Accent Node -->
    <circle class="logo-center-dot" cx="100" cy="115" r="7" fill="#F7F5F2"/>
  </g>
</svg>
