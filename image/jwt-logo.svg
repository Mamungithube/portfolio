<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
    <!-- Dark Background -->
    <rect width="200" height="200" rx="36" fill="#000000"/>
    
    <!-- Official JWT Starburst Pinwheel Emblem -->
    <g transform="translate(100, 100)">
        <!-- 0 deg: Top Vertical (White) -->
        <g transform="rotate(0)">
            <path d="M 0 -18 L 13.5 -35 L 13.5 -84 L -13.5 -84 L -13.5 -35 Z" fill="#FFFFFF"/>
        </g>
        
        <!-- 36 deg: Top-Right 1 (Pink/Red) -->
        <g transform="rotate(36)">
            <path d="M 0 -18 L 13.5 -35 L 13.5 -84 L -13.5 -84 L -13.5 -35 Z" fill="#F43F5E"/>
        </g>
        
        <!-- 72 deg: Mid-Right 2 (Purple/Magenta) -->
        <g transform="rotate(72)">
            <path d="M 0 -18 L 13.5 -35 L 13.5 -84 L -13.5 -84 L -13.5 -35 Z" fill="#C026D3"/>
        </g>

        <!-- 108 deg: Mid-Right 3 (Cyan/Blue) -->
        <g transform="rotate(108)">
            <path d="M 0 -18 L 13.5 -35 L 13.5 -84 L -13.5 -84 L -13.5 -35 Z" fill="#0284C7"/>
        </g>

        <!-- 144 deg: Bottom-Right 4 (Mint Teal) -->
        <g transform="rotate(144)">
            <path d="M 0 -18 L 13.5 -35 L 13.5 -84 L -13.5 -84 L -13.5 -35 Z" fill="#06B6D4"/>
        </g>

        <!-- 180 deg: Bottom Vertical (White) -->
        <g transform="rotate(180)">
            <path d="M 0 -18 L 13.5 -35 L 13.5 -84 L -13.5 -84 L -13.5 -35 Z" fill="#FFFFFF"/>
        </g>

        <!-- 216 deg: Bottom-Left 1 (Pink/Red) -->
        <g transform="rotate(216)">
            <path d="M 0 -18 L 13.5 -35 L 13.5 -84 L -13.5 -84 L -13.5 -35 Z" fill="#F43F5E"/>
        </g>

        <!-- 252 deg: Mid-Left 2 (Purple/Magenta) -->
        <g transform="rotate(252)">
            <path d="M 0 -18 L 13.5 -35 L 13.5 -84 L -13.5 -84 L -13.5 -35 Z" fill="#C026D3"/>
        </g>

        <!-- 288 deg: Mid-Left 3 (Cyan/Blue) -->
        <g transform="rotate(288)">
            <path d="M 0 -18 L 13.5 -35 L 13.5 -84 L -13.5 -84 L -13.5 -35 Z" fill="#0284C7"/>
        </g>

        <!-- 324 deg: Top-Left 4 (Mint Teal) -->
        <g transform="rotate(324)">
            <path d="M 0 -18 L 13.5 -35 L 13.5 -84 L -13.5 -84 L -13.5 -35 Z" fill="#06B6D4"/>
        </g>

        <!-- Inner Star Core Cutout Overlay (Pure Black) -->
        <path d="M 0 -20 L 5.8 -6 L 19 -11.8 L 11.8 -1.8 L 19 11.8 L 5.8 6 L 0 20 L -5.8 6 L -19 11.8 L -11.8 -1.8 L -19 -11.8 L -5.8 -6 Z" fill="#000000"/>
    </g>
</svg>
